schema_version: 1

context:
  name: fast-simplification
  version: 0.2.0
  build_number: 1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/pyvista/fast-simplification/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ae381e7876a9ed6e33c394b8bb500fc215bff52f90b484e4b2ddef5736d94785

build:
  number: ${{ build_number }}
  script:
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.15
    - make
  host:
    # Build system.
    - nanobind >=1.3.2
    - setuptools-scm >=8
    - scikit-build-core >=0.10
    # Dependencies.
    - pip
    - python
  run:
    - numpy
    - python
tests:
  - python:
      imports:
        - fast_simplification
      pip_check: true
  - script:
      - pytest ./tests/
    files:
      source:
        - tests/
    requirements:
      run:
        - pyvista
        - pytest

about:
  homepage: https://pyvista.github.io/fast-simplification
  license: MIT
  license_file: LICENSE
  repository: https://github.com/pyvista/fast-simplification
  summary: Fast Quadratic Mesh Simplification

extra:
  recipe-maintainers:
    - diegoferigo
    - akaszynski
